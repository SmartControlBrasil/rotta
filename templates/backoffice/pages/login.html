{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="DexignZone">
    <meta name="robots" content="noindex, nofollow">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, minimal-ui, viewport-fit=cover">
    <title>Rotta 116 Backoffice Login</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'backoffice/nexadash/images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'backoffice/nexadash/vendor/bootstrap-select/dist/css/bootstrap-select.min.css' %}">
    <link rel="stylesheet" href="{% static 'backoffice/nexadash/css/style.css' %}">
</head>
<body class="vh-100">
    <div class="authincation h-100">
        <div class="container-fluid h-100">
            <div class="row h-100">
                <div class="col-lg-6 col-md-12 col-sm-12 mx-auto align-self-center">
                    <div class="login-form">
                        <div class="text-center">
                            <img src="{% static 'backoffice/nexadash/images/logo-full.png' %}" class="mb-3 login-sm-logo mx-auto" alt="">
                            <h3 class="title">Sign In</h3>
                            <p>Sign in to your account to start using Rotta 116 Backoffice</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            {% if form.non_field_errors %}
                                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                            {% endif %}
                            <div class="mb-4">
                                <label class="mb-1" for="{{ form.username.id_for_label }}">Usuário<span class="text-danger"> *</span></label>
                                <input type="text" name="{{ form.username.html_name }}" class="form-control" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}" required autofocus>
                            </div>
                            <div class="mb-4 position-relative">
                                <label class="mb-1" for="{{ form.password.id_for_label }}">Senha<span class="text-danger"> *</span></label>
                                <input type="password" name="{{ form.password.html_name }}" id="dz-password" class="form-control" required>
                                <span class="show-pass eye">
                                    <i class="fa fa-eye-slash"></i>
                                    <i class="fa fa-eye"></i>
                                </span>
                            </div>
                            <div class="form-row d-flex justify-content-between mt-4 mb-2">
                                <div class="mb-4">
                                    <div class="form-check custom-checkbox mb-3">
                                        <input type="checkbox" class="form-check-input" id="customCheckBox1">
                                        <label class="form-check-label mt-1" for="customCheckBox1">Remember my preference</label>
                                    </div>
                                </div>
                            </div>
                            <div class="text-center mb-4 d-grid">
                                <button type="submit" class="btn btn-primary">Sign In</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-6">
                    <div class="pages-left h-100">
                        <div class="login-content">
                            <a href="{% url 'backoffice:dashboard' %}"><img src="{% static 'backoffice/nexadash/images/logo-full.png' %}" class="mb-3" alt=""></a>
                            <p>Painel operacional do Rotta 116 usando o NexaDash como adapter visual.</p>
                        </div>
                        <div class="login-media text-center">
                            <img src="{% static 'backoffice/nexadash/images/login.png' %}" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'backoffice/nexadash/vendor/global/global.min.js' %}"></script>
    <script src="{% static 'backoffice/nexadash/vendor/bootstrap-select/dist/js/bootstrap-select.min.js' %}"></script>
    <script src="{% static 'backoffice/nexadash/js/custom.js' %}"></script>
</body>
</html>
